server:
  port: 8080

spring:
  application:
    name: jeep-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/jeep
    username: jeep
    password: jeep
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        globally_quoted_identifiers: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  # Redis backs the cache-aside layer (org analytics + project task lists).
  # The cache fails open to the database, so a short timeout keeps a dead
  # Redis from slowing requests down. Overridden by env in compose/prod.
  # No Redis repositories are used (only StringRedisTemplate), so the
  # repository auto-configuration stays off: otherwise Spring Data would
  # scan every JPA repository on startup and log a warning per interface.
  data:
    redis:
      repositories:
        enabled: false
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      # Redis is an optional cache, not a readiness dependency: the app
      # serves from the database when Redis is down, so it stays out of
      # the readiness group (it still shows in the main /actuator/health).
      group:
        readiness:
          include: db, diskSpace, ping

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

jeep:
  app:
    name: JEEP
    environment: local
  security:
    cors:
      allowed-origins: ${JEEP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
    jwt:
      secret: ${JEEP_SECURITY_JWT_SECRET:local-development-secret-key-at-least-32-bytes}
