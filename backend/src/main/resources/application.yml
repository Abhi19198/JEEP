server:
  port: 8080

spring:
  application:
    name: jeep-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/jeep
    username: jeep
    password: jeep
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        globally_quoted_identifiers: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

jeep:
  app:
    name: JEEP
    environment: local
  security:
    cors:
      allowed-origins: ${JEEP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
    jwt:
      secret: ${JEEP_SECURITY_JWT_SECRET:local-development-secret-key-at-least-32-bytes}
