server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        globally_quoted_identifiers: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

jeep:
  app:
    name: JEEP
    environment: prod
  security:
    cors:
      allowed-origins: ${JEEP_CORS_ALLOWED_ORIGINS}
    jwt:
      secret: ${JEEP_SECURITY_JWT_SECRET}
      access-token-expiration-ms: ${JEEP_SECURITY_ACCESS_TOKEN_EXPIRATION_MS:900000}
      refresh-token-expiration-ms: ${JEEP_SECURITY_REFRESH_TOKEN_EXPIRATION_MS:604800000}
