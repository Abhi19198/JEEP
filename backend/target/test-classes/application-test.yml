spring:
  datasource:
    url: jdbc:h2:mem:jeep-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  sql:
    init:
      mode: never

jeep:
  security:
    jwt:
      secret: test-only-secret-key-at-least-32-bytes-long
    cors:
      allowed-origins: http://localhost:5173
