services:
  postgres:
    image: postgres:16.10-alpine
    container_name: jeep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jeep
      POSTGRES_USER: jeep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeep -d jeep"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: jeep-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jeep
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-jeep}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JEEP_SECURITY_JWT_SECRET: ${JEEP_SECURITY_JWT_SECRET:?JEEP_SECURITY_JWT_SECRET is required}
      JEEP_CORS_ALLOWED_ORIGINS: ${JEEP_CORS_ALLOWED_ORIGINS:?JEEP_CORS_ALLOWED_ORIGINS is required}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: jeep-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres_data:
